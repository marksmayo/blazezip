[package]
name = "blazezip"
version = "0.1.0"
edition = "2021"
description = "A very fast, parallel, standards-compliant ZIP archiver"
license = "MIT"
repository = "https://github.com/marksmayo/blazezip"
readme = "README.md"
keywords = ["zip", "archiver", "deflate", "zstd", "compression"]
categories = ["command-line-utilities", "compression"]

[workspace]
members = [".", "bench/benchrun"]

[dependencies]
zstd = "0.14"
crc32fast = "1.5"
memmap2 = "0.9"
anyhow = "1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
